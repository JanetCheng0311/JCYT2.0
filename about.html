  <!-- =====================================================================
       This page builds itself from the plain-text file:  content/about.txt
       To change any detail, open that text file (or double-click
       "1-Edit-content.command"), edit the words, then publish.
       You do NOT need to touch the code below.
       ===================================================================== -->
  <script>
  // Turn the plain-text file into structured data.
  function parseAbout(text) {
    const out = { name: "", fullname: "", role: "", location: "", intro: [], education: [], experience: [], tools: [], languages: [], awards: [] };
    let section = "";
    text.split(/\r?\n/).forEach((raw) => {
      const line = raw.trim();
      if (!line || line.startsWith("#")) return;            // blank or comment
      const sec = line.match(/^\[(.+?)\]/);
      if (sec) { section = sec[1].trim().toUpperCase(); return; }
      const kv = line.match(/^(NAME|FULLNAME|ROLE|LOCATION)\s*=\s*(.*)$/i);
      if (kv) { out[kv[1].toLowerCase()] = kv[2].trim(); return; }
      const isItem = line.startsWith("- ");
      const body = isItem ? line.slice(2).trim() : line;
      const f = body.split(/\s*\|\s*/);                     // "a | b | c" -> [a,b,c]
      switch (section) {
        case "INTRO": out.intro.push(body); break;
        case "EDUCATION": out.education.push({ program: f[0] || "", school: f[1] || "", dates: f[2] || "" }); break;
        case "EXPERIENCE": out.experience.push({ role: f[0] || "", org: f[1] || "", dates: f[2] || "", note: f[3] || "" }); break;
        case "TOOLS": (isItem ? [body] : body.split(",")).forEach((t) => { const v = t.trim(); if (v) out.tools.push(v); }); break;
        case "LANGUAGES": (isItem ? [body] : body.split(",")).forEach((t) => { const v = t.trim(); if (v) out.languages.push(v); }); break;
        case "AWARDS": out.awards.push({ title: f[0] || "", year: f[1] || "", note: f[2] || "", link: f[3] || "" }); break;
      }
    });
    return out;
  }

  function renderAbout(ABOUT) {
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const byId = (id) => document.getElementById(id);

    byId("ab-name").textContent = ABOUT.name || "JCYT";
    const fn = byId("ab-fullname");
    if (ABOUT.fullname) { fn.textContent = ABOUT.fullname; fn.style.display = ""; }
    else { fn.textContent = ""; fn.style.display = "none"; }
    byId("ab-tag").textContent = [ABOUT.role, ABOUT.location].filter(Boolean).join("  ·  ");

    const intro = byId("ab-intro"); intro.innerHTML = "";
    (ABOUT.intro || []).forEach((p) => intro.appendChild(el("p", null, p)));

    const edu = byId("ab-edu"); edu.innerHTML = "";
    (ABOUT.education || []).forEach((it) => {
      const li = el("li", "ab-item"), top = el("div", "top");
      top.appendChild(el("span", "title", it.program));
      if (it.dates) top.appendChild(el("span", "when", it.dates));
      li.appendChild(top);
      if (it.school) li.appendChild(el("div", "sub", it.school));
      edu.appendChild(li);
    });

    const exp = byId("ab-exp"); exp.innerHTML = "";
    (ABOUT.experience || []).forEach((it) => {
      const li = el("li", "ab-item"), top = el("div", "top");
      top.appendChild(el("span", "title", it.role));
      if (it.dates) top.appendChild(el("span", "when", it.dates));
      li.appendChild(top);
      if (it.org) li.appendChild(el("div", "sub", it.org));
      if (it.note) li.appendChild(el("div", "note", it.note));
      exp.appendChild(li);
    });

    const skills = byId("ab-skills"); skills.innerHTML = "";
    const tools = el("div", "tags");
    (ABOUT.tools || []).forEach((t) => tools.appendChild(el("span", "tag", t)));
    skills.appendChild(tools);
    if ((ABOUT.languages || []).length) {
      skills.appendChild(el("div", "ab-sub-h", "Languages"));
      const langs = el("div", "tags");
      ABOUT.languages.forEach((t) => langs.appendChild(el("span", "tag", t)));
      skills.appendChild(langs);
    }

    const aw = byId("ab-awards"); aw.innerHTML = "";
    (ABOUT.awards || []).forEach((it) => {
      const li = el("li", "ab-item"), top = el("div", "top");
      top.appendChild(el("span", "title", it.title));
      if (it.year) top.appendChild(el("span", "when", it.year));
      li.appendChild(top);
      if (it.note) li.appendChild(el("div", "note", it.note));
      if (it.link) {
        const wrap = el("div", "note"), a = el("a", "award-link", "View ↗");
        a.href = it.link; a.target = "_blank"; a.rel = "noopener";
        wrap.appendChild(a); li.appendChild(wrap);
      }
      aw.appendChild(li);
    });
  }

  // Load the text file and build the page. (Works on the live site and via the
  // "Preview locally" command. If opened straight from disk it can't read the
  // file, so we show a gentle hint.)
  fetch("content/about.txt", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("not found"); return r.text(); })
    .then((t) => renderAbout(parseAbout(t)))
    .catch(() => renderAbout({
      name: "JCYT",
      role: "About",
      intro: ["This page loads its content from content/about.txt.",
              "Open it through the live site or the “Preview locally” command to see it."],
      education: [], experience: [], tools: [], languages: [], awards: [],
    }));
  </script>
