  <!-- =====================================================================
       ▼▼▼  EDIT YOUR DETAILS HERE  ▼▼▼
       Everything on the About page comes from this one object.
       To change something, just edit the text inside the quotes.
       To add an item, copy a { ... } line and change its text.
       To remove an item, delete its { ... } line.
       (Keep the quotes and commas as they are.)
       ===================================================================== -->
  <script>
  const ABOUT = {
    name: "Janet Cheng",
    fullName: "Cheng Yu Tung",
    role: "Multimedia designer & creative technologist",
    location: "Hong Kong",

    // Short intro paragraphs (each "..." is one paragraph).
    intro: [
      "I'm finishing my MSc in Innovative Multimedia Entertainment at The Hong Kong Polytechnic University, where I also earned my BA (Hons) in Communication Design.",
      "I work across coding, AI content creation, game development and motion design — pairing a strong visual-design foundation with hands-on technical skills. I love prototyping ideas and building things together with a team.",
    ],

    // Education — newest first.
    education: [
      { program: "MSc Innovative Multimedia Entertainment", school: "The Hong Kong Polytechnic University", dates: "Aug 2025 — May 2026" },
      { program: "BA (Hons) Communication Design",          school: "The Hong Kong Polytechnic University", dates: "Aug 2021 — May 2025" },
      { program: "IELTS — Overall band 7.5",                school: "",                                     dates: "" },
    ],

    // Work experience — newest first.
    experience: [
      { role: "Intern, School of Design",     org: "Research Laboratory for Advanced Social Robotics, PolyU", dates: "Dec 2025 — Jan 2026", note: "Built Python text-to-speech / speech-to-text audio pipelines with API integrations." },
      { role: "Temporary Library Assistant",  org: "Hong Kong Metropolitan University",                       dates: "Jul 2025 — Aug 2025", note: "Counter duties, arranging books and packing new arrivals." },
      { role: "Design Intern",                org: "Wowwowtank Co. Limited",                                  dates: "Jun 2024 — Aug 2024", note: "Created commercial designs for various housing-estate projects." },
      { role: "Temporary Clerk",              org: "Hong Kong Buildings Department",                          dates: "Jul 2023 — Aug 2023", note: "General clerical and computer-related duties." },
    ],

    // Software / tools you use.
    tools: ["Photoshop", "Illustrator", "InDesign", "Premiere Pro", "After Effects", "Blender", "TouchDesigner", "Unreal", "Unity", "Python (VS Code)", "Affinity", "Canva", "CapCut"],

    // Languages.
    languages: ["Cantonese (native)", "English", "Mandarin"],

    // Awards & competitions — newest first. Leave "link" as "" if there's no link.
    awards: [
      { title: "HKFAA Poster Design Competition", year: "2024", note: "2nd runner-up — 42nd HK Film Awards Student Poster Design Competition.", link: "" },
      { title: "Graphis New Talent Awards",       year: "2024", note: "Honorable Mention.", link: "https://www.graphis.com/entry/b035f481-5c1c-443b-9acf-49d831145a6c/" },
      { title: "IDA — International Design Awards", year: "2023", note: "Silver in Print / Posters — collaborated with Korean university students.", link: "https://www.idesignawards.com/inners-old/zoom.php?cid=9-48599-23" },
      { title: "D&AD New Blood Awards",           year: "2023", note: "Took part in the D&AD New Blood brief; pitched the concept with Blender-made visuals.", link: "" },
    ],
  };
  /* ▲▲▲  END OF EDITABLE DETAILS — you don't need to touch anything below.  ▲▲▲ */

  (function renderAbout() {
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    const byId = (id) => document.getElementById(id);

    byId("ab-name").textContent = ABOUT.name;
    byId("ab-tag").textContent = [ABOUT.role, ABOUT.location].filter(Boolean).join("  ·  ");

    const intro = byId("ab-intro");
    (ABOUT.intro || []).forEach((p) => intro.appendChild(el("p", null, p)));

    // Education
    const edu = byId("ab-edu");
    (ABOUT.education || []).forEach((it) => {
      const li = el("li", "ab-item");
      const top = el("div", "top");
      top.appendChild(el("span", "title", it.program));
      if (it.dates) top.appendChild(el("span", "when", it.dates));
      li.appendChild(top);
      if (it.school) li.appendChild(el("div", "sub", it.school));
      edu.appendChild(li);
    });

    // Experience
    const exp = byId("ab-exp");
    (ABOUT.experience || []).forEach((it) => {
      const li = el("li", "ab-item");
      const top = el("div", "top");
      top.appendChild(el("span", "title", it.role));
      if (it.dates) top.appendChild(el("span", "when", it.dates));
      li.appendChild(top);
      if (it.org) li.appendChild(el("div", "sub", it.org));
      if (it.note) li.appendChild(el("div", "note", it.note));
      exp.appendChild(li);
    });

    // Skills
    const skills = byId("ab-skills");
    const tools = el("div", "tags");
    (ABOUT.tools || []).forEach((t) => tools.appendChild(el("span", "tag", t)));
    skills.appendChild(tools);
    if ((ABOUT.languages || []).length) {
      skills.appendChild(el("div", "ab-sub-h", "Languages"));
      const langs = el("div", "tags");
      ABOUT.languages.forEach((t) => langs.appendChild(el("span", "tag", t)));
      skills.appendChild(langs);
    }

    // Awards
    const aw = byId("ab-awards");
    (ABOUT.awards || []).forEach((it) => {
      const li = el("li", "ab-item");
      const top = el("div", "top");
      top.appendChild(el("span", "title", it.title));
      if (it.year) top.appendChild(el("span", "when", it.year));
      li.appendChild(top);
      if (it.note) li.appendChild(el("div", "note", it.note));
      if (it.link) {
        const wrap = el("div", "note");
        const a = el("a", "award-link", "View ↗");
        a.href = it.link; a.target = "_blank"; a.rel = "noopener";
        wrap.appendChild(a);
        li.appendChild(wrap);
      }
      aw.appendChild(li);
    });
  })();
  </script>
</body>
