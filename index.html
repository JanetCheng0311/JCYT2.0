<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ASCII — Generative</title>
<style>
  :root {
    /* active palette is injected by JS as CSS vars too, for UI chrome */
    --bg: #1d3fd1;
    --fg: #f4f1e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  /* canvas fills the viewport on every device, safe-area aware */
  #art {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* correct on mobile browsers w/ dynamic toolbars */
    touch-action: manipulation;
  }
  /* minimal floating controls */
  .hud {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 10;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    user-select: none;
  }
  .hud button {
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--fg);
    background: color-mix(in srgb, var(--bg) 70%, #000 10%);
    border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform .12s ease, background .2s ease, opacity .2s ease;
  }
  .hud button:hover { transform: translateY(-1px); }
  .hud button:active { transform: translateY(0); opacity: .8; }
  .hud .label {
    font-size: 12px;
    opacity: .65;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  /* swatches */
  .swatches { display: flex; gap: 6px; }
  .swatch {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4);
    cursor: pointer;
    padding: 0;
    transition: transform .12s ease;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
  @media (max-width: 480px) {
    .hud .mode-name { display: none; }
  }
</style>
</head>
<body>
  <canvas id="art" aria-label="Generative ASCII artwork"></canvas>

  <div class="hud">
    <button id="pause" title="Play / pause animation">⏸ Pause</button>
    <button id="next" title="Jump to next style">Style →</button>
    <span class="mode-name label" id="modeName">drift</span>
    <span class="label">·</span>
    <div class="swatches" id="swatches"></div>
    <button id="autocolor" title="Auto-cycle colors" aria-pressed="false">Auto-color: off</button>
  </div>

<script>
/* =====================================================================
   Generative ASCII artwork
   - Responsive: rebuilds character grid for any viewport, retina-sharp
   - Morphs through styles: flow → density → stitch → contour → ...
   - Palette system with a startable color-change function (starts blue)
   ===================================================================== */

/* ---------- 1. Palettes (blue first, per your 3rd reference image) ---------- */
const PALETTES = {
  cobalt:   { name: "cobalt",   bg: "#1d3fd1", ink: "#f4f1e8", accent: "#9fb4ff" },
  blueprint:{ name: "blueprint",bg: "#0a1f6e", ink: "#cfe0ff", accent: "#5b8cff" },
  ink:      { name: "ink",      bg: "#f4f1e8", ink: "#16357a", accent: "#3a63d0" }, // cream w/ blue ink (like ref #2)
  ember:    { name: "ember",    bg: "#160d0a", ink: "#ff7a3c", accent: "#ffd0a0" },
  mono:     { name: "mono",     bg: "#0c0c0c", ink: "#e9e9e9", accent: "#888888" },
  jade:     { name: "jade",     bg: "#062b22", ink: "#a9f0d1", accent: "#3fbf8f" },
};
const PALETTE_ORDER = ["cobalt", "blueprint", "ink", "jade", "ember", "mono"];
let palette = PALETTES.cobalt;

/* ---------- 2. Canvas setup ---------- */
const canvas = document.getElementById("art");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1;
let cols = 0, rows = 0, cell = 14;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); // cap for perf on retina
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // cell size scales with screen — dense fill on every device
  const minSide = Math.min(W, H);
  cell = Math.max(7, Math.min(13, Math.round(minSide / 64)));
  cols = Math.ceil(W / cell) + 1;
  rows = Math.ceil(H / cell) + 1;

  ctx.font = `${cell + 1}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textBaseline = "top";
}
window.addEventListener("resize", resize, { passive: true });
window.addEventListener("orientationchange", resize, { passive: true });

/* ---------- 3. Lightweight value-noise (no deps) ---------- */
// Hash-based smooth noise, good enough for flow fields & density.
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi),     b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y) { // fractal noise for organic structure
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 3; i++) { v += amp * noise2(x * freq, y * freq); freq *= 2; amp *= 0.5; }
  return v;
}

/* ---------- 4. ONE unified character ramp ---------- */
// A single light→dark density ramp. Digits and symbols live on the SAME
// ramp ordered by visual weight, so the art never looks like "two styles".
// Two leading spaces give a little breathing room; everything else fills.
const RAMP = " .·:;-~=+iocsxz2358O0Q%#@".split("");
const RLAST = RAMP.length - 1;

/* ---------- 5. Movements ----------
   Not different styles — different *motions* of the same dense field.
   They share the ramp above; only the flow/warp/contrast params change,
   so the character language stays consistent the whole time. */
const MOVEMENTS = [
  { name: "drift",  scale: 0.052, warp: 2.4, gamma: 1.05, lobe: 0.42, flow: [ 0.05,  0.03,  0.02] },
  { name: "weave",  scale: 0.078, warp: 1.7, gamma: 0.85, lobe: 0.30, flow: [ 0.03, -0.02,  0.04] },
  { name: "ripple", scale: 0.034, warp: 3.4, gamma: 1.30, lobe: 0.55, flow: [ 0.02,  0.04, -0.03] },
  { name: "swirl",  scale: 0.060, warp: 2.9, gamma: 1.10, lobe: 0.38, flow: [-0.04,  0.05,  0.03] },
];
const FBM_NORM = 1 / 0.875; // normalize 3-octave fbm back to ~0..1

// Domain-warped density field — the source of the organic, flowing look.
function field(fx, fy, t, P) {
  const s = P.scale, fa = P.flow;
  // two-stage domain warp -> organic, flowing structure
  const q1 = fbm(fx * s + t * fa[0], fy * s);
  const q2 = fbm(fx * s + 5.2, fy * s + t * fa[1] + 1.3);
  const nx = fx * s + P.warp * (q1 - 0.45);
  const ny = fy * s + P.warp * (q2 - 0.45) + t * fa[2];
  const w = fbm(nx, ny) * FBM_NORM;                              // base mass 0..1
  // ridged higher-freq layer -> flowing "vein" lines like the contour refs
  const ridg = 1 - Math.abs(fbm(nx * 2.3 + 11.0, ny * 2.3) * FBM_NORM * 2 - 1);
  // slow large lobe -> big light/dark masses drift through (a subject emerging)
  const lobe = fbm(fx * 0.013 + t * 0.008, fy * 0.013 + 9.1) * FBM_NORM;
  let v = w * 0.6 + ridg * 0.4;
  v = v * (1 - P.lobe) + lobe * P.lobe;
  // strong S-curve contrast -> clear forms instead of flat haze
  v = (v - 0.5) * 1.9 + 0.5;
  v = v < 0 ? 0 : v > 1 ? 1 : v;
  return Math.pow(v, P.gamma);
}

// Smoothly blend two movement param sets (used while morphing between them).
function lerpMove(A, B, k) {
  const L = (a, b) => a + (b - a) * k;
  return {
    name: k < 0.5 ? A.name : B.name,
    scale: L(A.scale, B.scale), warp: L(A.warp, B.warp),
    gamma: L(A.gamma, B.gamma), lobe: L(A.lobe, B.lobe),
    flow: [L(A.flow[0], B.flow[0]), L(A.flow[1], B.flow[1]), L(A.flow[2], B.flow[2])],
  };
}

/* ---------- 6. Animation loop (dense, single-ramp render) ---------- */
let mvIndex = 0;          // current movement
let mvNext = 0;           // movement we're easing toward
let mvK = 1;              // 0..1 blend between current and next movement
const MOVE_HOLD = 11000;  // ms each movement holds before auto-advancing
let lastSwitch = 0;
let t = 0;                // virtual time (advances only while playing)
let playing = true;
let lastFrame = 0;

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const easeInOut = (k) => k * k * (3 - 2 * k);

function advanceStyle() {
  mvIndex = mvNext;
  mvNext = (mvIndex + 1) % MOVEMENTS.length;
  mvK = 0;
  document.getElementById("modeName").textContent = MOVEMENTS[mvNext].name;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - lastFrame || 16);
  lastFrame = now;

  if (playing) {
    t += dt * 0.001 * 9; // animation speed
    if (now - lastSwitch > MOVE_HOLD) { lastSwitch = now; advanceStyle(); }
  }
  if (mvK < 1) mvK = Math.min(1, mvK + dt / 2200); // slow ease between movements

  // active (blended) movement params — one field, one ramp, fully unified
  const P = mvK >= 1
    ? MOVEMENTS[mvIndex]
    : lerpMove(MOVEMENTS[mvIndex], MOVEMENTS[mvNext], easeInOut(mvK));

  // background
  ctx.fillStyle = palette.bg;
  ctx.fillRect(0, 0, W, H);

  const inkRGB = hexToRgb(palette.ink);
  const accRGB = hexToRgb(palette.accent);
  const inkStr = inkRGB.join(",");
  const accStr = accRGB.join(",");

  for (let r = 0; r < rows; r++) {
    const yPx = r * cell;
    for (let c = 0; c < cols; c++) {
      const v = field(c, r, t, P);
      const ch = RAMP[(v * RLAST) | 0];
      if (ch === " ") continue;                 // sparse breathing space only
      const alpha = 0.16 + 0.84 * v;            // dense, high-contrast depth
      const rgb = v > 0.82 ? accStr : inkStr;   // brightest cells pick up accent
      ctx.fillStyle = `rgba(${rgb},${alpha.toFixed(3)})`;
      ctx.fillText(ch, c * cell, yPx);
    }
  }
}

/* ---------- 7. Palette / color-change function ---------- */
function setPalette(nameOrPalette) {
  palette = typeof nameOrPalette === "string" ? (PALETTES[nameOrPalette] || palette) : nameOrPalette;
  document.documentElement.style.setProperty("--bg", palette.bg);
  document.documentElement.style.setProperty("--fg", palette.ink);
  // reflect pressed state on swatches
  document.querySelectorAll(".swatch").forEach(s =>
    s.setAttribute("aria-pressed", String(s.dataset.pal === palette.name)));
}

// Auto color-cycling (the "color changing function" — starts OFF on blue)
let autoColor = false;
let colorTimer = null;
function startColorCycle(intervalMs = 7000) {
  stopColorCycle();
  autoColor = true;
  let i = PALETTE_ORDER.indexOf(palette.name);
  colorTimer = setInterval(() => {
    i = (i + 1) % PALETTE_ORDER.length;
    setPalette(PALETTE_ORDER[i]);
  }, intervalMs);
}
function stopColorCycle() { autoColor = false; if (colorTimer) clearInterval(colorTimer); colorTimer = null; }

/* ---------- 8. HUD wiring ---------- */
function buildSwatches() {
  const wrap = document.getElementById("swatches");
  wrap.innerHTML = "";
  PALETTE_ORDER.forEach(key => {
    const p = PALETTES[key];
    const b = document.createElement("button");
    b.className = "swatch";
    b.dataset.pal = key;
    b.title = key;
    b.style.background = p.bg;
    b.style.boxShadow = `inset 0 0 0 6px ${p.ink}22`;
    b.setAttribute("aria-pressed", String(key === palette.name));
    b.addEventListener("click", () => { stopColorCycle(); updateAutoBtn(); setPalette(key); });
    wrap.appendChild(b);
  });
}
function updateAutoBtn() {
  const btn = document.getElementById("autocolor");
  btn.textContent = "Auto-color: " + (autoColor ? "on" : "off");
  btn.setAttribute("aria-pressed", String(autoColor));
}

document.getElementById("pause").addEventListener("click", (e) => {
  playing = !playing;
  e.target.textContent = playing ? "⏸ Pause" : "▶ Play";
});
document.getElementById("next").addEventListener("click", () => {
  lastSwitch = performance.now();
  advanceStyle();
});
document.getElementById("autocolor").addEventListener("click", () => {
  if (autoColor) stopColorCycle(); else startColorCycle();
  updateAutoBtn();
});

// double-tap / double-click the art to advance style (nice on touch devices)
canvas.addEventListener("dblclick", () => { lastSwitch = performance.now(); advanceStyle(); });

/* ---------- 9. Boot ---------- */
resize();
setPalette("cobalt");   // start on the blue you liked
buildSwatches();
updateAutoBtn();
lastSwitch = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
