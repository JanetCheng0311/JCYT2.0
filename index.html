<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ASCII — Flow Field</title>
<style>
  /* ---- Self-hosted fonts (Fontsource CDN — no Google tracking) ---- */
  @font-face {
    font-family: 'Geist'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url('https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/files/geist-latin-wght-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url('https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5/files/geist-mono-latin-wght-normal.woff2') format('woff2');
  }

  :root {
    --bg: #1d3fd1;
    --fg: #f4f1e8;
    --font-sans: 'Geist', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --pad: clamp(16px, 3vw, 30px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  #art {
    display: block; position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: manipulation;
  }

  /* gradient scrims keep the logo / menu / controls legible over the art */
  .scrim { position: fixed; left: 0; right: 0; z-index: 15; pointer-events: none; }
  .scrim-top { top: 0; height: 140px; background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 80%, #000 8%), transparent); }
  .scrim-bottom { bottom: 0; height: 170px; background: linear-gradient(to top, color-mix(in srgb, var(--bg) 80%, #000 8%), transparent); }

  /* ---- Top bar: logo (left) + menu (right) ---- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(14px, 2.4vw, 24px) var(--pad);
    padding-top: max(clamp(14px,2.4vw,24px), env(safe-area-inset-top));
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }

  .logo {
    display: inline-flex; align-items: baseline; gap: 2px;
    font-family: var(--font-sans);
    font-weight: 650; font-size: clamp(17px, 2vw, 21px);
    letter-spacing: 0.30em; text-indent: 0.30em;
    color: var(--fg); text-decoration: none;
    line-height: 1; user-select: none;
    transition: opacity .2s ease;
  }
  .logo:hover { opacity: .78; }
  .logo .dot { color: var(--accent, #bcd0ff); letter-spacing: 0; }

  .menu-btn {
    pointer-events: auto;
    width: 46px; height: 40px; display: grid; align-content: center; justify-items: center;
    gap: 5px; background: transparent; border: 0; cursor: pointer; padding: 0;
  }
  .menu-btn .ln {
    width: 24px; height: 2px; border-radius: 2px; background: var(--fg);
    transition: transform .32s cubic-bezier(.6,.05,.2,1), opacity .2s ease;
  }
  .menu-btn[aria-expanded="true"] .ln:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .menu-btn[aria-expanded="true"] .ln:nth-child(2) { opacity: 0; }
  .menu-btn[aria-expanded="true"] .ln:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ---- Full-screen menu overlay (scaffold for future pages) ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 25;
    background: color-mix(in srgb, var(--bg) 86%, #000 14%);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; flex-direction: column; justify-content: center;
    padding: var(--pad);
    opacity: 0; visibility: hidden; transform: translateY(-8px);
    transition: opacity .35s ease, transform .35s ease, visibility .35s;
  }
  .overlay.open { opacity: 1; visibility: visible; transform: none; }
  .overlay nav { display: flex; flex-direction: column; gap: clamp(6px, 1.4vw, 14px); max-width: 1200px; margin: 0 auto; width: 100%; }
  .overlay a {
    display: flex; align-items: baseline; gap: 18px;
    color: var(--fg); text-decoration: none;
    font-family: var(--font-sans); font-weight: 600;
    font-size: clamp(34px, 9vw, 84px); line-height: 1.04;
    letter-spacing: -0.02em;
    opacity: .55; transition: opacity .25s ease, transform .25s ease;
  }
  .overlay a .idx {
    font-family: var(--font-mono); font-weight: 400;
    font-size: clamp(11px, 1.4vw, 14px); letter-spacing: 0.1em;
    opacity: .6; transform: translateY(-0.3em);
  }
  .overlay a:hover, .overlay a:focus-visible { opacity: 1; transform: translateX(10px); outline: none; }
  .overlay a[aria-disabled="true"] { cursor: default; }
  .overlay a[aria-disabled="true"]:hover { transform: none; opacity: .7; }
  .overlay .soon {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    opacity: .5; border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
    border-radius: 999px; padding: 3px 8px; transform: translateY(-0.6em);
  }
  .overlay .foot {
    margin-top: clamp(24px, 5vw, 48px); max-width: 1200px; margin-left: auto; margin-right: auto; width: 100%;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; opacity: .55;
  }

  /* ---- Bottom control dock ---- */
  .hud {
    position: fixed; z-index: 20;
    left: var(--pad);
    bottom: max(var(--pad), calc(env(safe-area-inset-bottom) + 12px));
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    user-select: none;
  }
  .btn {
    font-family: var(--font-mono);
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--fg);
    background: color-mix(in srgb, var(--bg) 62%, #000 16%);
    border: 1px solid color-mix(in srgb, var(--fg) 24%, transparent);
    border-radius: 999px; padding: 8px 14px;
    cursor: pointer; white-space: nowrap;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .14s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .btn:hover { transform: translateY(-1.5px); background: color-mix(in srgb, var(--bg) 50%, #000 18%); border-color: color-mix(in srgb, var(--fg) 45%, transparent); }
  .btn:active { transform: scale(.97); opacity: .9; }
  .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .hud .label {
    font-family: var(--font-mono);
    font-size: 11px; opacity: .6; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .swatches { display: flex; gap: 7px; padding: 0 2px; }
  .swatch {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.45); cursor: pointer; padding: 0;
    transition: transform .14s ease;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }

  @media (max-width: 540px) {
    .hud .mode-name, .hud .dotsep { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .overlay a, .menu-btn .ln, .btn { transition: none; }
  }
</style>
</head>
<body>
  <canvas id="art" aria-label="Generative ASCII flow-field artwork"></canvas>
  <div class="scrim scrim-top"></div>
  <div class="scrim scrim-bottom"></div>

  <!-- Top bar: logo + menu -->
  <header class="topbar">
    <a class="logo" href="./" aria-label="JCYT — home">JCYT<span class="dot">.</span></a>
    <button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="overlay">
      <span class="ln"></span><span class="ln"></span><span class="ln"></span>
    </button>
  </header>

  <!-- Full-screen menu (scaffold — add page links here later) -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Site menu">
    <nav>
      <a href="./"><span class="idx">01</span>Home</a>
      <a href="#" aria-disabled="true"><span class="idx">02</span>Work <span class="soon">soon</span></a>
      <a href="#" aria-disabled="true"><span class="idx">03</span>About <span class="soon">soon</span></a>
      <a href="#" aria-disabled="true"><span class="idx">04</span>Contact <span class="soon">soon</span></a>
    </nav>
    <div class="foot">JCYT — portfolio · 2026</div>
  </div>

  <!-- Bottom control dock -->
  <div class="hud">
    <button id="pause" class="btn" title="Play / pause animation">⏸ Pause</button>
    <button id="next" class="btn" title="Release a fresh set of particles">✦ Reseed</button>
    <span class="mode-name label" id="modeName">flow field</span>
    <span class="label dotsep">·</span>
    <div class="swatches" id="swatches"></div>
    <button id="autocolor" class="btn" title="Auto-cycle colors" aria-pressed="false">Auto-color: off</button>
  </div>

<script>
/* =====================================================================
   Generative ASCII — Perlin flow field + particle trails
   Inspired by the classic p5.js / Coding Train flow-field sketches:
   particles drift through a Perlin-noise vector field and leave trails,
   "like leaves in the wind". Their accumulated paths are rendered as a
   single digit ramp, so it reads as flowing rivers of numbers.
   ===================================================================== */

/* ---------- Palettes (blue first) ---------- */
const PALETTES = {
  cobalt:   { name: "cobalt",   bg: "#1d3fd1", ink: "#f4f1e8", accent: "#bcd0ff" },
  blueprint:{ name: "blueprint",bg: "#0a1f6e", ink: "#cfe0ff", accent: "#7ea8ff" },
  ink:      { name: "ink",      bg: "#f4f1e8", ink: "#16357a", accent: "#3a63d0" },
  ember:    { name: "ember",    bg: "#160d0a", ink: "#ff7a3c", accent: "#ffd0a0" },
  mono:     { name: "mono",     bg: "#0c0c0c", ink: "#e9e9e9", accent: "#9aa0aa" },
  jade:     { name: "jade",     bg: "#062b22", ink: "#a9f0d1", accent: "#5fe0aa" },
};
const PALETTE_ORDER = ["cobalt", "blueprint", "ink", "jade", "ember", "mono"];
let palette = PALETTES.cobalt;

/* ---------- Canvas ---------- */
const canvas = document.getElementById("art");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1;
let cols = 0, rows = 0, cell = 11;

// trail intensity grid + particles
let trail = null;
let particles = [];
let prevCells = -1;

function targetParticleCount() {
  return Math.min(1900, Math.max(260, Math.round(cols * rows * 0.32)));
}

function spawn(p) {
  p = p || {};
  p.x = Math.random() * cols;
  p.y = Math.random() * rows;
  p.life = 0;
  p.maxLife = 40 + (Math.random() * 140 | 0);
  return p;
}
function buildParticles() {
  const n = targetParticleCount();
  particles = new Array(n);
  for (let i = 0; i < n; i++) particles[i] = spawn({});
}
function reseed() {                         // fresh streams on demand
  for (let i = 0; i < particles.length; i++) spawn(particles[i]);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const minSide = Math.min(W, H);
  cell = Math.max(7, Math.min(12, Math.round(minSide / 60)));
  cols = Math.ceil(W / cell) + 1;
  rows = Math.ceil(H / cell) + 1;

  ctx.font = `${cell + 1}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textBaseline = "top";

  if (!trail || prevCells !== cols * rows) {
    prevCells = cols * rows;
    trail = new Float32Array(cols * rows);
    buildParticles();
  }
}
window.addEventListener("resize", resize, { passive: true });
window.addEventListener("orientationchange", resize, { passive: true });

/* ---------- Value-noise → smooth flow field ---------- */
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
const smooth = (t) => t * t * (3 - 2 * t);
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi),     b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 3; i++) { v += amp * noise2(x * freq, y * freq); freq *= 2; amp *= 0.5; }
  return v; // ~0..0.875
}

/* ---------- Digit ramp (one consistent style) ---------- */
const RAMP = " 1742356908".split("");
const RLAST = RAMP.length - 1;

/* ---------- Simulation constants (fixed => constant speed) ---------- */
const FS = 0.055;       // flow-field spatial scale
const SPEED = 0.85;     // particle step (cells / frame)
const Z_STEP = 0.010;   // how fast the field itself evolves
const FADE = 0.93;      // trail persistence (higher = longer streaks)
const DEPOSIT = 0.5;    // ink dropped per particle per frame
const TCAP = 6;         // max trail intensity before clamp
const TNORM = 0.32;     // intensity → 0..1 mapping (lower = more gradient)

let z = 0;
let playing = true;
let lastFrame = 0;

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function step() {
  z += Z_STEP;
  // fade existing trails
  for (let i = 0; i < trail.length; i++) trail[i] *= FADE;

  const TWO_PI = Math.PI * 2;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    // flow angle from the (animated) noise field
    const a = fbm(p.x * FS, p.y * FS + z) * TWO_PI * 2.2;
    p.x += Math.cos(a) * SPEED;
    p.y += Math.sin(a) * SPEED;
    // wrap toroidally
    if (p.x < 0) p.x += cols; else if (p.x >= cols) p.x -= cols;
    if (p.y < 0) p.y += rows; else if (p.y >= rows) p.y -= rows;
    // deposit ink into the trail grid
    const idx = (p.y | 0) * cols + (p.x | 0);
    const t = trail[idx] + DEPOSIT;
    trail[idx] = t > TCAP ? TCAP : t;
    // recycle so streams keep forming and dissolving
    if (++p.life > p.maxLife) spawn(p);
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - lastFrame || 16);
  lastFrame = now;

  if (playing && trail) step();

  ctx.fillStyle = palette.bg;
  ctx.fillRect(0, 0, W, H);
  if (!trail) return;

  const inkStr = hexToRgb(palette.ink).join(",");
  const accStr = hexToRgb(palette.accent).join(",");

  for (let r = 0; r < rows; r++) {
    const yPx = r * cell, row = r * cols;
    for (let c = 0; c < cols; c++) {
      let d = trail[row + c] * TNORM;    // normalize intensity → 0..~1
      if (d <= 0.02) continue;
      if (d > 1) d = 1;
      const ch = RAMP[(d * RLAST) | 0];
      if (ch === " ") continue;
      const alpha = 0.25 + 0.75 * d;
      ctx.fillStyle = `rgba(${d > 0.78 ? accStr : inkStr},${alpha.toFixed(3)})`;
      ctx.fillText(ch, c * cell, yPx);
    }
  }
}

/* ---------- Palette / color-change ---------- */
function setPalette(nameOrPalette) {
  palette = typeof nameOrPalette === "string" ? (PALETTES[nameOrPalette] || palette) : nameOrPalette;
  document.documentElement.style.setProperty("--bg", palette.bg);
  document.documentElement.style.setProperty("--fg", palette.ink);
  document.documentElement.style.setProperty("--accent", palette.accent);
  document.querySelectorAll(".swatch").forEach(s =>
    s.setAttribute("aria-pressed", String(s.dataset.pal === palette.name)));
}
let autoColor = false, colorTimer = null;
function startColorCycle(intervalMs = 7000) {
  stopColorCycle();
  autoColor = true;
  let i = PALETTE_ORDER.indexOf(palette.name);
  colorTimer = setInterval(() => {
    i = (i + 1) % PALETTE_ORDER.length;
    setPalette(PALETTE_ORDER[i]);
  }, intervalMs);
}
function stopColorCycle() { autoColor = false; if (colorTimer) clearInterval(colorTimer); colorTimer = null; }

/* ---------- HUD ---------- */
function buildSwatches() {
  const wrap = document.getElementById("swatches");
  wrap.innerHTML = "";
  PALETTE_ORDER.forEach(key => {
    const p = PALETTES[key];
    const b = document.createElement("button");
    b.className = "swatch";
    b.dataset.pal = key;
    b.title = key;
    b.style.background = p.bg;
    b.style.boxShadow = `inset 0 0 0 6px ${p.ink}22`;
    b.setAttribute("aria-pressed", String(key === palette.name));
    b.addEventListener("click", () => { stopColorCycle(); updateAutoBtn(); setPalette(key); });
    wrap.appendChild(b);
  });
}
function updateAutoBtn() {
  const btn = document.getElementById("autocolor");
  btn.textContent = "Auto-color: " + (autoColor ? "on" : "off");
  btn.setAttribute("aria-pressed", String(autoColor));
}

document.getElementById("pause").addEventListener("click", (e) => {
  playing = !playing;
  e.target.textContent = playing ? "⏸ Pause" : "▶ Play";
});
document.getElementById("next").addEventListener("click", reseed);
document.getElementById("autocolor").addEventListener("click", () => {
  if (autoColor) stopColorCycle(); else startColorCycle();
  updateAutoBtn();
});
canvas.addEventListener("dblclick", reseed);

/* ---------- Menu overlay ---------- */
const menuBtn = document.getElementById("menuBtn");
const overlay = document.getElementById("overlay");
function setMenu(open) {
  overlay.classList.toggle("open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
}
menuBtn.addEventListener("click", () => setMenu(!overlay.classList.contains("open")));
overlay.addEventListener("click", (e) => {
  // close when clicking empty space or a real link; ignore disabled links
  const a = e.target.closest("a");
  if (a && a.getAttribute("aria-disabled") === "true") { e.preventDefault(); return; }
  if (!a || a.getAttribute("href") === "./") setMenu(false);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

/* ---------- Boot ---------- */
resize();
setPalette("cobalt");
buildSwatches();
updateAutoBtn();
requestAnimationFrame(frame);
</script>
</body>
</html>
